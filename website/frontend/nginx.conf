# Zugriffslog OHNE personenbezogene Daten (4.11.2026). Das Standardformat
# des Images ("main") schrieb die echte Besucher-IP mit — der Host-nginx
# reicht sie als X-Forwarded-For durch —, dazu Browserkennung, Referrer und
# den vollen Query-String. $uri ist der Pfad OHNE Query: Ein alter
# Teilen-Link "/?claim=<Behauptung>" erscheint hier als "/".
# Diese Datei liegt in conf.d/ und damit im http-Kontext, den log_format
# verlangt. Gegenstueck auf dem Host: website/host_logs_ohne_ip.sh.
log_format ohne_ip '[$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log ohne_ip;
    # Eine Fehlerzeile traegt die volle Anfrage samt Query-String; die
    # haeufigste (fehlendes apple-touch-icon) braucht niemand.
    log_not_found off;

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Ohne Cache-Control wendet der Browser heuristische Frische an und
        # liefert nach einem Deploy noch die ALTE Datei aus. Am 26.9.2026
        # reproduziert: Die neue style.css kam erst nach manuellem
        # Cache-Bust an, obwohl der Deploy durch war (PR #209).
        # Die Dateinamen tragen keinen Hash, also muss jede Auslieferung
        # revalidiert werden. Mit dem ETag, das nginx ohnehin setzt, ist das
        # ein 304 ohne Body — nicht ein voller Download.
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_connect_timeout 10s;

        # SSE (Server-Sent Events) support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
}
