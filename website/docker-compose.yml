name: evidora

services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      # Read-only Mount des Service-Account-JSONs für GDELT BigQuery.
      # Auf prod wird ./secrets/ mit chmod 600 gepflegt; in der lokalen
      # Entwicklung kann das Verzeichnis leer sein (Service skippt dann).
      - ./secrets:/app/secrets:ro
      # Static-First-Daten als rw-Mount (wiederhergestellt 2026-07-02):
      # (1) Hot-Reload — data/*.json-Edits + git pull wirken ohne Rebuild
      #     (mtime-aware Cache, ARCHITECTURE §4.1); ohne Mount sind die
      #     Daten ins Image eingebacken und Pull-Änderungen erreichen den
      #     Container nie. (2) Generierte Caches (cordis_projects_slim,
      #     claimreview_index) + Cron-Refreshes (refresh_cordis,
      #     refresh_eurostat_crime via run_evidora_tool.sh) überleben
      #     Rebuilds, statt bei jedem --build verloren zu gehen.
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Log-Rotation (Audit R2-4): ohne Limit wächst der json-file-Log
    # unbegrenzt -> Disk-Fraß (Prod hatte schon Disk-Druck, M1). Der
    # monatliche prune-Cron räumt Running-Container-Logs NICHT. 20m×5 =
    # max. 100 MB pro Service.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Security hardening (H4a-c, 2026-05-08)
    #
    # mem_limit MUSS unter dem physischen Host-RAM liegen, sonst schuetzt das
    # cgroup-Limit den Host gar nicht. Bis 2026-09-05 stand hier 4g bei
    # 3.814 MB Host-RAM — genau diese Konstellation riss am 08.08.2026 die
    # ganze Maschine mit (SSH und nginx tot, Hard-Reboot noetig), als ein
    # zweiter Python-Prozess im Container Modelle nachlud.
    #
    # Gemessen am 05.09.2026 (cgroup v2, nach einem echten Cold Start mit
    # Model-Prefetch):
    #   memory.peak    3.407 MB   <- dominiert von PAGE CACHE beim Modell-Lesen
    #   memory.current 2.703 MB
    #     davon anon   2.178 MB   <- echt belegt, nicht rueckholbar
    #     davon file     461 MB   <- Cache, holt der Kernel unter Druck zurueck
    #   memory.events  oom 0, oom_kill 0, max 0
    #
    # Die frueher notierte Empfehlung "3g, vorher messen" waere ohne diese
    # Aufschluesselung falsch begruendet gewesen: 3g liegt UNTER dem
    # Peak (3.407 MB) und haette wie ein sicherer OOM-Kill ausgesehen. Da der
    # Peak aber fast nur Cache ist, sind 3g rund 900 MB ueber dem echten
    # anon-Bedarf — reichlich Luft.
    #
    # memswap_limit gibt 512 MB Swap-Polster (Host hat 2 GB Swap, 114 MB in
    # Benutzung): Damit ist der Fehlermodus "Container wird langsam" statt
    # "Container wird hart gekillt". Bleibt der Kill trotzdem noetig, faengt
    # ihn `restart: unless-stopped` — der Host ueberlebt in jedem Fall.
    mem_limit: 3g
    memswap_limit: 3584m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # (cap_add: DAC_OVERRIDE entfernt 2026-07-02 — H4e non-root uid 1000
    # hat native Schreibrechte auf den burrito-owned data-Mount.)
    # H4d (2026-07-02): unveränderliches Root-FS. Verifiziert: der Prozess
    # schreibt zur Laufzeit ausschließlich nach /app/data (rw-Mount);
    # tmpfs nur als Sicherheitsnetz für Temp-/Home-Pfade.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/evidora:size=16m,uid=1000,gid=1000
    healthcheck:
      # /api/health/full statt /api/legal (QA50D HOCH 2, 2026-08-08):
      # /api/legal ist ein statischer Endpunkt ohne LLM-Beteiligung. Am
      # 29.07. war der Dienst ~12 h vollstaendig ausgefallen (Mistral-Key
      # -> 401, jeder Claim brach ab) und der Container meldete durchgehend
      # "healthy". /api/health/full prueft SpaCy + sentence-transformers +
      # Static-Cache UND den LLM-Auth-Pfad (gecacht, token-frei).
      # Sicher gegen Flapping: nur ein nachweislich abgelehnter Key
      # (401/403) macht unhealthy; Timeouts/429/5xx zaehlen als OK.
      # Sicher gegen Restart-Schleifen: compose-`restart` greift bei
      # Container-EXIT, nicht bei "unhealthy" — der Container bleibt also
      # stehen und wird nur markiert; alarmiert wird per Cron-Kanarienvogel.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/full')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 300s statt 180s: health/full verlangt geladene Modelle, der
      # Cold-Start dauert real ~250-270s (Model-Prefetch + DataCommons).
      start_period: 300s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Log-Rotation (Audit R2-4) — siehe backend.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Security hardening (H4a-c, 2026-05-08)
    mem_limit: 512m
    memswap_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # nginx initial PID file ownership
      - SETUID           # nginx master → worker privilege drop
      - SETGID           # nginx master → worker privilege drop
      - NET_BIND_SERVICE # bind to port 80
    # H4d (2026-07-02): Root-FS read-only; nginx braucht nur Cache/PID/Temp.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    healthcheck:
      # nginx:alpine bringt KEIN curl mit, nur busybox-wget (Audit R2-3:
      # der curl-Check schlug immer fehl -> Container dauerhaft "unhealthy"
      # trotz laufendem nginx -> Alarm-Blindheit + Deploy-Health-Wait hing).
      # 127.0.0.1 statt localhost: nginx lauscht nur IPv4 (`listen 80;`),
      # busybox-wget würde localhost sonst zuerst auf ::1 (IPv6) auflösen
      # -> "Connection refused".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
