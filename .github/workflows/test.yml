    #   - test_freedom_house_fiw_2026 (FIW-Ausgabe kommt aus report_year, nicht
    #                                  aus Code oder Dateiname; PR+CL==Total
    #                                  fuer alle 55 Laender; world_summary war
    #                                  totes Feld)
    #   - test_freedom_house_pack_konsistenz (demokratie_pack fuehrt eine
    #                                  zweite Kopie der FH-Zahlen — sie muss
    #                                  dem Connector entsprechen)
    #   - test_onkologie_pack_provenienz (Pack hatte GAR keine Metadaten;
    #                                  Mistel-Evidenz von Cochrane 2008 auf
    #                                  Phase-III-RCT MISTRAL 2024 ergaenzt)
    #   - test_onkologie_screening_fokussiert (Sammel-Fakt nach Screening-Typ
    #                                  geteilt; USPSTF-Grades korrigiert;
    #                                  EU-Rat 2022 + AT-Programm ergaenzt)
    #   - test_url_gate_klammern      (URL-Extraktor des check-new-urls-Gates
    #                                  brach an der ersten Klammer ab; jetzt
    #                                  balancierte Klammern behalten)
    #   - test_rki_saison_2025_26     (Atemwegs-Saison 2025/26 aus RKI-Open-Data;
    #                                  drei falsche Zahlen + verkehrte Richtung
    #                                  im alten Stand; GrippeWeb != Konsultation)
