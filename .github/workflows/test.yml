    #                                  Direktiven — #73-Follow-up)
    #   - test_verdict_numeric_patterns (L4-Muster G/H/I/J: Vergleich/
    #                                  Schwelle/Verhältnis/Top-N numerisch
    #                                  + Negations-Gates — QA50B)
    #   - test_pattern_e_bound_age_guard (Pattern E: Schranken-/Alters-
    #                                  Angaben sind keine Messwerte —
    #                                  QA50D #316, 2 Live-Summaries gepinnt)
    #   - test_pattern_a_generische_attribution (Pattern A: Fremd-
    #                                  Attribution des Superlativs auch bei
    #                                  NICHT-geografischen Entitaeten — QA50D #342)
    #   - test_pattern_h_negierte_schwelle (Pattern H: negierte Schwelle
    #                                  kehrt die Richtung um statt die
    #                                  Bestaetigung abzuschalten — QA50D #311)
    #   - test_pattern_k_dismissals    (Pattern K: Dismissal-Abdeckung +
