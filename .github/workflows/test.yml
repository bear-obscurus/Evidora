name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  light-unit-tests:
    name: Unit tests (dependency-light suites)
    runs-on: ubuntu-latest

    # The full pytest suite needs SpaCy models + sentence-transformers
